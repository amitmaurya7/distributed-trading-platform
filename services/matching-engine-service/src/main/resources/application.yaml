server:
  port: 8085
spring:
  application:
    name: matching-engine-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
